  <g transform="translate(20.91 12.8) scale(0.8)">
    <path
      d="M89.72 25.87A46 46 0 1 0 89.72 102.13L89.72 81.3A31 31 0 1 1 89.72 46.7Z"
      fill="#fafafa"
    />
  </g>
</svg>

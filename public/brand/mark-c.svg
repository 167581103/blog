    <path
      d="M97 34
         C93 26 83 21 72 23
         C51 26 33 45 32 67
         C31 88 45 103 63 101
         C77 100 88 93 94 84
         C96.1 80.9 97.2 78.6 98 77"
      stroke="#111111"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
